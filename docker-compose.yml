services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: settleup
      POSTGRES_USER: settleup
      POSTGRES_PASSWORD: settleup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this rather than for the container merely being "started", because
      # Postgres accepts the port well before it accepts queries.
      test: ["CMD-SHELL", "pg_isready -U settleup -d settleup"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/settleup
      DB_USER: settleup
      DB_PASSWORD: settleup
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      JWT_SECRET: local-development-secret-key-at-least-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
