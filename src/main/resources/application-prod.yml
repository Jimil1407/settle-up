# Production profile (Render).
#
# Every value that differs between environments comes from an environment variable, and none of
# them have defaults that would work in production by accident — a missing DB_HOST or JWT_SECRET
# fails the container at startup rather than silently falling back to something local.

server:
  # Render assigns the port at runtime and routes traffic to it; binding to a hard-coded 8080
  # would make the service unreachable.
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    # Let in-flight requests finish when Render replaces the instance during a deploy.
    timeout-per-shutdown-phase: 25s

  datasource:
    # Composed from parts rather than a single DATABASE_URL: Render hands out a libpq-style
    # postgres:// URL, which the JDBC driver does not accept without rewriting.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Render's free Postgres allows relatively few connections, and the group row lock already
      # serialises the writes that matter, so a large pool would only queue deeper inside the DB.
      maximum-pool-size: 5
      pool-name: settleup-pool

  sql:
    init:
      # Schema is CREATE TABLE IF NOT EXISTS throughout, so running it on every boot is a no-op
      # after the first deploy.
      mode: always
      platform: postgresql

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2s

settleup:
  redis-enabled: true
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 24
  cors:
    # Set to the exact frontend origin once it is known. The default permits any Render subdomain
    # so the first deploy works before the static site URL has been assigned.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://settleup-web.onrender.com/**}

logging:
  level:
    com.settleup: INFO
    org.hibernate.SQL: WARN
