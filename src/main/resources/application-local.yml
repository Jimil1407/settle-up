# Zero-infrastructure profile: run with `mvn spring-boot:run -Dspring-boot.run.profiles=local`
# and the whole API comes up on an in-memory database with no Docker, Postgres or Redis required.
#
# The in-memory adapters for the cache, idempotency store and rate limiter are single-JVM only,
# which is exactly why production uses the Redis implementations instead.

spring:
  datasource:
    url: jdbc:h2:mem:settleup;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      platform: h2

  jpa:
    hibernate:
      ddl-auto: validate

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

settleup:
  redis-enabled: false
  jwt:
    secret: local-development-only-secret-key-32-chars

logging:
  level:
    com.settleup: DEBUG
