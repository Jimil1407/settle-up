spring:
  datasource:
    # LOCK_TIMEOUT is raised well above the H2 default because the concurrency test intentionally
    # piles many threads onto one group row; the default would surface as spurious lock timeouts
    # rather than the contention behaviour we actually want to exercise.
    url: jdbc:h2:mem:settleup;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # Sized above the concurrency test's thread count so threads block on the group row lock,
      # which is the contention we want to exercise, rather than on connection checkout.
      maximum-pool-size: 60
      pool-name: settleup-test-pool

  sql:
    init:
      mode: always
      platform: h2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Redis is not required to run the suite: the in-memory adapters below stand in for it, so the
  # tests stay runnable on any machine with just a JDK.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

settleup:
  redis-enabled: false
  jwt:
    secret: test-secret-key-that-is-definitely-long-enough-32
    ttl-hours: 1
  recurring:
    # Far-future cron so the scheduler never fires on its own during tests; the job is driven
    # explicitly instead.
    cron: "0 0 2 29 2 ?"

logging:
  level:
    com.settleup: INFO
    org.hibernate.SQL: WARN
